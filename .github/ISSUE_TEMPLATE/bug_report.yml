name: Bug report
description: A tool, the directory, or the MCP server did the wrong thing
title: "[Bug] "
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Slug or URL, if this is one tool. Example json-formatter or /mcp.
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Input you used, or the MCP tools/call body. Leave out secrets.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version, or the MCP client (Cursor, Claude Desktop, VS Code, curl).
    validations:
      required: true
